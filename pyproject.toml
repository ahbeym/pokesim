[project]
name = "pokesim"
version = "0.1.0"
description = "CLI Pokemon battle simulator engine"
readme = "README.md"
authors = [
    { name = "Ahbey Mesfin", email = "amesfin@mitre.org" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2>=2.16.2",
]

[project.scripts]
pokesim = "pokesim:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
